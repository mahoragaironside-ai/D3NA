<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D3NA</title>
    <style>
      :root {
        --bg: #F5F6F8; --surface: #FFFFFF; --ink: #15181F; --ink-soft: #5B6270; --border: #E3E6EB;
        --navy: #1E56E8; --navy-soft: #E8EEFF; --green: #1E7A52; --green-bg: #EAF5EF;
        --amber: #946B1D; --amber-bg: #FAF1E1; --red: #B03A2E; --red-bg: #FBEAE8;
      }
      [data-theme="dark"] {
        --bg: #15171C; --surface: #1D2027; --ink: #ECEEF2; --ink-soft: #9AA1AE; --border: #2B2F38;
        --navy: #3B7BFF; --navy-soft: #16233F; --green: #3FBE8B; --green-bg: #163229;
        --amber: #E0AA4E; --amber-bg: #3A2E15; --red: #E27263; --red-bg: #3B1D1A;
      }
      body { background: var(--bg); }
      [data-admin-theme="neural"] {
        --bg: #050A16; --surface: #111B30; --ink: #ECEEF2; --ink-soft: #93A0BF; --border: #1B2942;
        --navy: #075BFF; --navy-soft: #0A1224; --green: #3FD6A0; --green-bg: #0E2A22;
        --amber: #F0B84E; --amber-bg: #322611; --red: #FF6B5E; --red-bg: #351515;
      }
    </style>
  <script>
(function(){
function mostraErro(m){var r=document.getElementById('root');if(r)r.innerHTML='<div style="padding:20px;font-family:monospace;font-size:13px;color:#e74c3c;white-space:pre-wrap;">'+m+'</div>';}
window.addEventListener('error',function(e){
if(e.target&&e.target.tagName==='SCRIPT'){mostraErro('FALHOU A DESCARREGAR: '+e.target.src);return;}
mostraErro('ERRO: '+(e.message||'')+(e.error&&e.error.stack?'\n'+e.error.stack:''));
},true);
window.addEventListener('unhandledrejection',function(e){mostraErro('ERRO: '+(e.reason&&e.reason.stack?e.reason.stack:e.reason));});
setTimeout(function(){var r=document.getElementById('root');if(r&&r.innerHTML.indexOf('A carregar o D3NA')>-1)mostraErro('A app nao arrancou em 20s. O ficheiro JS nao chegou a executar (rede fraca?). Recarrega a pagina.');},20000);
})();
</script>
</head>
  <body style="margin:0;">
    <div id="root"><p style="color:#9aa4b2;font-family:sans-serif;text-align:center;margin-top:40vh;padding:0 24px">A carregar o D3NA… se demorar, o servidor está a acordar (até 1 minuto). Não feches a página.</p></div>
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
