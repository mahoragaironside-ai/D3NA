<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D3NA</title>
    <style>
      :root {
        --bg: #F5F6F8; --surface: #FFFFFF; --ink: #15181F; --ink-soft: #5B6270; --border: #E3E6EB;
        --navy: #1E56E8; --navy-soft: #E8EEFF; --green: #1E7A52; --green-bg: #EAF5EF;
        --amber: #946B1D; --amber-bg: #FAF1E1; --red: #B03A2E; --red-bg: #FBEAE8;
      }
      [data-theme="dark"] {
        --bg: #15171C; --surface: #1D2027; --ink: #ECEEF2; --ink-soft: #9AA1AE; --border: #2B2F38;
        --navy: #3B7BFF; --navy-soft: #16233F; --green: #3FBE8B; --green-bg: #163229;
        --amber: #E0AA4E; --amber-bg: #3A2E15; --red: #E27263; --red-bg: #3B1D1A;
      }
      body { background: var(--bg); }
    </style>
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
